<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Lil Fish — The Last Hand</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #090c11; color: #faf5e0; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: min(100vw, 177.777778vh); height: auto; aspect-ratio: 16 / 9; image-rendering: pixelated; outline: none; }
    #status { position: absolute; padding: 24px; max-width: 80%; text-align: center; font: 20px system-ui, sans-serif; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <p id="status" role="status">Loading Lil Fish…</p>
  <canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="Lil Fish card game. Enter to start, ask, or push. Space to bank. Escape for settings. Mouse controls are also available."></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    function showError(message) {
      status.textContent = message + ' Reload the page to try again.';
      status.hidden = false;
    }
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', () => canvas.focus());
    canvas.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      showError('The graphics connection was lost.');
    });
    window.addEventListener('keydown', event => {
      if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'F5', 'F6', 'F7'].includes(event.code)) event.preventDefault();
    });
    window.addEventListener('error', () => showError('The game could not load.'));
    window.addEventListener('unhandledrejection', () => showError('The game could not load.'));
    var Module = {
      arguments: ['./game.love'],
      INITIAL_MEMORY: 67108864,
      canvas,
      printErr: console.error.bind(console),
      setStatus(text) {
        status.textContent = text || '';
        status.hidden = !text;
      },
      onRuntimeInitialized() { canvas.focus(); },
      onAbort() { showError('The game stopped unexpectedly.'); }
    };
  </script>
  <script src="game.js"></script>
  <script src="love.js" onload="Love(Module)" onerror="showError('The game could not download.')"></script>
</body>
</html>
